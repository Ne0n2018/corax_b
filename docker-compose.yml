services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: corax_app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: corax
      DATABASE_URL: postgresql://root:123456@db:5432/corax?schema=public
      POSTGRES_URI: postgresql://root:123456@db:5432/corax?schema=public
      RUN_MIGRATIONS: "true"
    expose:
      - "4000"
    depends_on:
      - db
      - redis
    networks:
      - backend
    healthcheck:
      test: |
        node -e "require('http').get('http://localhost:4000/metrics', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: ghcr.io/ne0n2018/corax_f:latest
    container_name: corax_frontend
    restart: unless-stopped

    expose:
      - "3000"
    networks:
      - backend

  nginx:
    image: nginx:alpine
    container_name: corax_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend
    depends_on:
      - app
      - frontend



  db:
    image: postgres:15-alpine
    container_name: corax_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432" # Проброс порта наружу для локального подключения через DBeaver
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: corax_redis
    restart: unless-stopped
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    driver: bridge