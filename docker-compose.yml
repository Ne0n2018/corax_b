services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: corax_app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: corax
      DATABASE_URL: postgresql://root:123456@db:5432/corax?schema=public
      POSTGRES_URI: postgresql://root:123456@db:5432/corax?schema=public
      RUN_MIGRATIONS: "true"
      RUN_SEEDS: 'true'
    expose:
      - "4000"
    depends_on:
      - db
      - redis
    extra_hosts:
      - "checkout.bepaid.by:185.183.120.65"
      - "s3-minsk.cloud.mts.by:134.17.88.139"
      - "image.s3-minsk.cloud.mts.by:134.17.88.139"
    networks:
      - backend
      - dokploy-network
    healthcheck:
      test: |
        node -e "require('http').get('http://localhost:4000/metrics', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: ghcr.io/ne0n2018/corax_f:latest
    container_name: corax_frontend
    restart: unless-stopped
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
    expose:
      - "3000"
    networks:
      - backend
      - dokploy-network

  db:
    image: postgres:15-alpine
    container_name: corax_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: corax_redis
    restart: unless-stopped
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: corax_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # Храним историю 30 дней, чтобы в Grafana были доступны
      # продажи/популярность за любые промежутки вплоть до месяца
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - backend
      - dokploy-network
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: corax_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - backend
      - dokploy-network
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  backend:
    driver: bridge
  dokploy-network:
    external: true