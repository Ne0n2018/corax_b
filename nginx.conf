# Ограничение частоты запросов к API
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

upstream nestjs_backend {
    server app:4000;
}

upstream nextjs_frontend {
    # Имя контейнера фронтенда в docker-compose
    server frontend:3000;
}

# 1. HTTP Сервер: Проверка Certbot и редирект на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name corax.by www.corax.by;

    # Важно: точка проверки владения доменом для Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё остальное перенаправляем на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

