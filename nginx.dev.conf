upstream nestjs_backend {
    server app:4000;
}

upstream nextjs_client {
    # host.docker.internal обращается к localhost вашей хост-машины
    server host.docker.internal:3000;
}

# 1. Редирект HTTP -> HTTPS
server {
    listen 80;
    server_name localhost;

    return 301 https://$host$request_uri;
}

# 2. HTTPS Сервер
server {
    listen 443 ssl;
    server_name localhost;

    # Пути к локальным сертификатам в контейнере (монтируются из ./certs-local)
    # Пути к сертификатам внутри контейнера
    ssl_certificate /etc/ssl/local/selfsigned.crt;
    ssl_certificate_key /etc/ssl/local/selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    # Запросы к API (NestJS)
    location /api/ {
        proxy_pass http://nestjs_backend;
        proxy_http_version 1.1;

        # Поддержка WebSockets / Socket.io
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Раскомментируйте, если в NestJS НЕ задан setGlobalPrefix('api')
        rewrite ^/api/(.*)$ /$1 break;
    }

    # Запросы к клиенту (Next.js dev-сервер)
    location / {
        proxy_pass http://nextjs_client;
        proxy_http_version 1.1;

        # Поддержка HMR (Hot Module Replacement) для Next.js
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}